  /* first recharge banner */
  .first-recharge{
    margin:14px 18px 0;
    border-radius:18px;

    /* background:linear-gradient(120deg,#17D6E0 0%,#12B8C9 55%,#0FA0B4 100%); */

    background-position:center;
    color:#fff;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 20px -8px rgba(18,199,214,.6);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .first-recharge:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 26px -8px rgba(18,199,214,.75);
  }
  .first-recharge:active{
    transform:translateY(0) scale(.99);
  }
  .first-recharge::after{
    content:"";
    position:absolute;
    right:-30px;top:-40px;
    width:150px;height:150px;
    background:radial-gradient(circle, rgba(255,255,255,.25), transparent 70%);
  }
  .first-recharge h2{
    margin:0 0 2px;
    font-size:22px;
    font-weight:800;

  }
  .first-recharge p.sub{

  }


.carousel{
  margin:14px 18px 0;
  border-radius:18px;
  height:190px;                 /* matches the banner's height */
  position:relative;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 8px 20px -8px rgba(18,199,214,.6);
}
.carousel-track{
  display:flex;
  height:100%;
  transition:transform .4s ease;
}



.carousel-slide{
  flex:0 0 100%;
  height:100%;
  background-color:#12B8C9;   /* letterbox fill if the image is a different ratio */
  overflow:hidden;
   background-position: fixed;
  background-repeat: no-repeat;
  background-size: cover;
}
.carousel-slide img{
  width:100%;
  height:100%;
  object-fit:cover;      /* fills the box, crops edges evenly — use this for photos */
  /* object-fit:contain; ← use this instead if you'd rather see the WHOLE image
     with no cropping (may show empty bars on the sides) */
  object-position:center;
  display:block;
  background-position: fixed;
  background-repeat: no-repeat;
  background-size: cover;
}

    font-size:11px;
    font-weight:800;
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
    box-shadow:0 2px 4px rgba(0,0,0,.15);

  .bonus-tag.purple{background:linear-gradient(90deg,#8B6EF5,#6E5CE7);}

    font-weight:800;
    padding:3px 10px;
    border-radius:0 0 8px 8px;

    position:fixed;
    right:14px;
    bottom:110px;

    background-position:center;
    display:flex;align-items:center;justify-content:center;

    font-weight:700;
    padding:1px 6px;

    .gift-float .badge{animation:none;}

  ];

  const chestSVG = `<svg viewBox="0 0 64 64"><rect x="8" y="30" width="48" height="24" rx="4" fill="#B5651D"/><rect x="8" y="30" width="48" height="8" fill="#8A4513"/><path d="M8 30c0-11 10-18 24-18s24 7 24 18" fill="#D97C2B"/><path d="M8 30c0-11 10-18 24-18s24 7 24 18" fill="none" stroke="#8A4513" stroke-width="2"/><rect x="27" y="26" width="10" height="10" rx="2" fill="#FFD24C"/><circle cx="32" cy="31" r="2.4" fill="#8A4513"/></svg>`;

  // const giftSVG = `<svg viewBox="0 0 64 64"><rect x="10" y="26" width="44" height="30" rx="2" fill="#FF6FA0"/><rect x="4" y="18" width="56" height="12" rx="3" fill="#FF8FBE"/><rect x="28" y="18" width="8" height="38" fill="#FF6FA0"/><path d="M32 18c-8 0-11-8-6-11 5-2 8 5 6 11zM32 18c8 0 11-8 6-11-5-2-8 5-6 11z" fill="#FF6FA0"/></svg>`;

// ---- carousel ----
(function(){
  const track = document.getElementById('carouselTrack');
  const dots  = document.querySelectorAll('#carouselDots .dot');
  const carousel = document.getElementById('carousel');
  const total = dots.length;
  let index = 0;
  let timer;

  function goTo(i){
    index = (i + total) % total;
    track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, n) => d.classList.toggle('active', n === index));
  }

  function next(){ goTo(index + 1); }

  function start(){ timer = setInterval(next, 3000); }
  function stop(){ clearInterval(timer); }

  start();

  // swipe support
  let startX = 0;
  carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; stop(); });
  carousel.addEventListener('touchend', e => {
    const diff = e.changedTouches[0].clientX - startX;
    if (diff > 40) goTo(index - 1);
    else if (diff < -40) goTo(index + 1);
    start();
  });

  // click a dot to jump
  dots.forEach((dot, i) => dot.addEventListener('click', () => { goTo(i); stop(); start(); }));
})();

</script>
