<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WePlay · Recharge</title>
<style>
  :root{
    --brand-cyan:#12C7D6;
    --ink:#1B2430;
    --ink-soft:#6B7684;
    --bg:#F4F6F7;
    --card:#FFFFFF;
    --card-alt:#FDF1E4;
    --price:#FF7A1A;
    --line:#ECEEF0;

    /* Drop a custom page background here if you want one, e.g. url('bg.jpg') */
    --page-bg-image:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color:var(--bg);
    background-image:var(--page-bg-image);
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .app-shell{
    max-width:480px;
    margin:0 auto;
    background:var(--bg);
    min-height:100vh;
    position:relative;
  }

  /* header */
  header.top{
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:44px;height:44px;border-radius:14px;
    background-image:url("dp.jpeg");
    background-size:cover;
    background-position:center;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);
  }
  .brand-name{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
    color:var(--ink);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  }

  /* user ID badge — shows the WePlay ID carried over from index.html */
  .user-badge{
    display:flex;
    align-items:center;
    gap:7px;
    background:#F2F3F5;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px 6px 6px;
  }
  .user-badge .tag{
    font-size:10px;
    font-weight:800;
    letter-spacing:.4px;
    color:#fff;
    background:var(--brand-cyan);
    border-radius:999px;
    padding:3px 8px;
  }
  .user-badge .value{
    font-size:15px;
    font-weight:800;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    letter-spacing:.3px;
  }

  /* carousel */
  .carousel{
    margin:14px 18px 0;
    border-radius:18px;
    height:190px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 8px 20px -8px rgba(18,199,214,.6);
  }
  .carousel-track{
    display:flex;
    height:100%;
    transition:transform .4s ease;
  }
  .carousel-slide{
    position:relative;
    flex:0 0 100%;
    height:100%;
    overflow:hidden;
    background:#12B8C9;
  }
  /* soft blurred copy of the same image fills any leftover space so the
     banner always looks intentional, no matter its original aspect ratio */
  .carousel-slide .slide-blur{
    position:absolute;
    inset:-20px;
    background-size:cover;
    background-position:center;
    filter:blur(22px) brightness(.7);
    transform:scale(1.15);
  }
  .carousel-slide .slide-img{
    position:relative;
    z-index:1;
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;  /* shows the whole banner — nothing gets cropped */
    object-position:center;
  }
  .carousel-dots{
    position:absolute;
    bottom:10px;
    left:0;right:0;
    display:flex;
    justify-content:center;
    gap:6px;
    z-index:2;
  }
  .carousel-dots .dot{
    width:6px;height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
    transition:width .25s ease, background .25s ease;
  }
  .carousel-dots .dot.active{
    width:18px;
    border-radius:4px;
    background:#fff;
  }

  .divider{
    height:1px;
    background:var(--line);
    margin:20px 18px 0;
  }

  /* gold list */
  .gold-list{
    padding:16px 18px 40px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .gold-card{
    background:var(--card);
    border-radius:16px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:16px;
    border:1px solid var(--line);
    position:relative;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .gold-card:active{transform:scale(.98);}
  .gold-card.featured{
    background:var(--card-alt);
    border-color:#F6DCB8;
  }
  .gold-card.best-value{
    border:1.5px solid var(--price);
    box-shadow:0 6px 18px -10px rgba(255,122,26,.5);
  }
  .icon-wrap{
    width:64px;height:64px;
    flex:none;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .icon-wrap svg{width:56px;height:56px;}
  .bonus-tag{
    position:absolute;
    bottom:-6px;left:50%;
    transform:translateX(-50%);
    background:linear-gradient(90deg,#FF8A3D,#FF5F5F);
    color:#fff;
    font-size:11px;
    font-weight:800;
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
    box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .bonus-tag.purple{background:linear-gradient(90deg,#8B6EF5,#6E5CE7);}
  .combo-badge{
    position:absolute;
    top:-6px;left:2px;
    background:#FFE1E1;
    color:#E4442B;
    font-size:11px;
    font-weight:800;
    padding:1px 6px;
    border-radius:8px;
    display:flex;align-items:center;gap:2px;
  }
  .gold-info{flex:1;}
  .gold-name{font-size:18px;font-weight:800;}
  .gold-price{
    font-size:19px;
    font-weight:800;
    color:var(--price);
  }
  .best-flag{
    position:absolute;
    top:-10px;right:12px;
    background:var(--price);
    color:#fff;
    font-size:11px;
    font-weight:800;
    padding:3px 10px;
    border-radius:0 0 8px 8px;
  }
</style>
</head>
<body>

<div class="app-shell">

  <header class="top">
    <div class="brand">
      <div class="brand-mark"></div>
      <span class="brand-name">WePlay</span>
    </div>
    <div class="user-badge">
      <span class="tag">ID</span>
      <span class="value" id="user_id">—</span>
    </div>
  </header>

  <div class="carousel" id="carousel">
    <div class="carousel-track" id="carouselTrack">
      <div class="carousel-slide">
        <div class="slide-blur" style="background-image:url('coursel1.jpeg')"></div>
        <img class="slide-img" src="coursel1.jpeg" alt="Recharge promotion 1">
      </div>
      <div class="carousel-slide">
        <div class="slide-blur" style="background-image:url('coursel2.jpeg')"></div>
        <img class="slide-img" src="coursel2.jpeg" alt="Recharge promotion 2">
      </div>
      <div class="carousel-slide">
        <div class="slide-blur" style="background-image:url('coursel3.jpeg')"></div>
        <img class="slide-img" src="coursel3.jpeg" alt="Recharge promotion 3">
      </div>
    </div>
    <div class="carousel-dots" id="carouselDots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="gold-list" id="goldList">
    <!-- cards injected by JS -->
  </div>

</div>

<script>
  // ---- gold package data ----
  const goldPackages = [
    { name: "40K Gold",  price: 1250,  bonus: 4000,   featured:false },
    { name: "100K Gold", price: 2050,  bonus: 10000,  featured:false },
    { name: "500K Gold", price: 8000,  bonus: 50000,  featured:false },
    { name: "1M Gold",   price: 15000, bonus: 100000, featured:false, best:true },
    { name: "2M Gold",   price: 25050, bonus: 200000, featured:false, combo:1 },
    { name: "3M Gold",   price: 30540, bonus: 300000, featured:false, combo:1 },
    { name: "4M Gold",   price: 35798, bonus: 400000, featured:false, combo:2 },
    { name: "5M Gold",   price: 45995, bonus: 500000, featured:false, combo:5 },
  ];

  function coinSVG(uid){
    return `<svg viewBox="0 0 64 64">
    <defs>
      <linearGradient id="coinBack${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFE07A"/>
        <stop offset="100%" stop-color="#EF9B23"/>
      </linearGradient>
      <linearGradient id="coinFront${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFF6D9"/>
        <stop offset="55%" stop-color="#FFD24C"/>
        <stop offset="100%" stop-color="#F2A21B"/>
      </linearGradient>
    </defs>
    <circle cx="23" cy="41" r="16.5" fill="url(#coinBack${uid})"/>
    <circle cx="23" cy="41" r="16.5" fill="none" stroke="#D9840E" stroke-width="1.4" opacity=".55"/>
    <circle cx="41" cy="25" r="17" fill="url(#coinFront${uid})"/>
    <circle cx="41" cy="25" r="17" fill="none" stroke="#E0900F" stroke-width="1.6"/>
    <circle cx="41" cy="25" r="12.2" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.3" stroke-dasharray="2 3"/>
    <path d="M41 14l2.6 7 7.4 1.1-5.4 5 1.3 7.3-5.9-3.5-5.9 3.5 1.3-7.3-5.4-5 7.4-1.1z" fill="#FFF8E1"/>
    <ellipse cx="35.5" cy="18" rx="6.5" ry="3" fill="#fff" opacity=".35"/>
  </svg>`;
  }

  function chestSVG(uid){
    return `<svg viewBox="0 0 64 64">
    <defs>
      <linearGradient id="chestBase${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C97A32"/>
        <stop offset="100%" stop-color="#8A4B1E"/>
      </linearGradient>
      <linearGradient id="chestLid${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#E39449"/>
        <stop offset="100%" stop-color="#B5651D"/>
      </linearGradient>
    </defs>
    <rect x="8" y="32" width="48" height="22" rx="4" fill="url(#chestBase${uid})"/>
    <path d="M14 44c4 4 32 4 36 0" stroke="#6E3A14" stroke-width="1.2" opacity=".35" fill="none"/>
    <path d="M8 32c0-12 10.5-19 24-19s24 7 24 19" fill="url(#chestLid${uid})"/>
    <path d="M8 32c0-12 10.5-19 24-19s24 7 24 19" fill="none" stroke="#6E3A14" stroke-width="1.6"/>
    <rect x="5" y="30" width="54" height="5" rx="2.5" fill="#F4C24C"/>
    <rect x="29" y="13" width="6" height="41" fill="#F4C24C"/>
    <circle cx="32" cy="33" r="4.2" fill="#6E3A14"/>
    <circle cx="32" cy="33" r="2.3" fill="#FFD24C"/>
  </svg>`;
  }

  function iconFor(pkg, uid){
    return pkg.combo ? chestSVG(uid) : coinSVG(uid);
  }

  function formatBonus(n){
    return n.toLocaleString('en-IN');
  }

  const list = document.getElementById('goldList');

  goldPackages.forEach((pkg, i) => {
    const card = document.createElement('div');
    card.className = 'gold-card' + (pkg.featured ? ' featured' : '') + (pkg.best ? ' best-value' : '');

    const comboBadge = pkg.combo ? `<div class="combo-badge">📣 ×${pkg.combo}</div>` : '';
    const bestFlag = pkg.best ? `<div class="best-flag">BEST VALUE</div>` : '';

    card.innerHTML = `
      ${bestFlag}
      <div class="icon-wrap">
        ${comboBadge}
        ${iconFor(pkg, i)}
        <div class="bonus-tag${pkg.featured ? ' purple' : ''}">+🪙${formatBonus(pkg.bonus)}</div>
      </div>
      <div class="gold-info">
        <div class="gold-name">${pkg.name}</div>
      </div>
      <div class="gold-price">₹${pkg.price.toLocaleString('en-IN')}</div>
    `;
    card.addEventListener('click', () => {
      alert(`Selected: ${pkg.name} for ₹${pkg.price.toLocaleString('en-IN')} (+${formatBonus(pkg.bonus)} bonus)`);
    });
    list.appendChild(card);
  });

  // ---- show the WePlay ID carried over from index.html ----
  const savedId = localStorage.getItem("myValue");
  document.getElementById("user_id").textContent = savedId || "Guest";

  // ---- carousel ----
  (function(){
    const track = document.getElementById('carouselTrack');
    const dots  = document.querySelectorAll('#carouselDots .dot');
    const carousel = document.getElementById('carousel');
    const total = dots.length;
    let index = 0;
    let timer;

    function goTo(i){
      index = (i + total) % total;
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((d, n) => d.classList.toggle('active', n === index));
    }
    function next(){ goTo(index + 1); }
    function start(){ timer = setInterval(next, 3000); }
    function stop(){ clearInterval(timer); }

    start();

    // swipe support
    let startX = 0;
    carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; stop(); });
    carousel.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].clientX - startX;
      if (diff > 40) goTo(index - 1);
      else if (diff < -40) goTo(index + 1);
      start();
    });

    // click a dot to jump
    dots.forEach((dot, i) => dot.addEventListener('click', () => { goTo(i); stop(); start(); }));
  })();
</script>

</body>
</html>
